services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_URL: ${BACKEND_API_URL}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    init: true
